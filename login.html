<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login - Water Price Top Up BD</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>


<div class="form-wrapper">

  <div class="form-card">


    <div class="form-logo">
      W
    </div>


    <h1>
      Welcome Back 👋
    </h1>

    <p>
      Login to continue to Water Price Top Up BD
    </p>


    <!-- GOOGLE -->

    <button
      class="google-btn"
      id="googleLogin">

      <svg
        class="google-icon"
        viewBox="0 0 48 48">

        <path
          fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c10 0 19.3-7.2 19.3-20 0-1.3-.1-2.3-.3-3.5z"/>

        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.7 16 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>

        <path
          fill="#4CAF50"
          d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.2C29.6 35.1 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5C9.5 39.7 16.2 44 24 44z"/>

        <path
          fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.7 5.5-6.9 6.7l6.3 5.2C34.1 40.5 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/>

      </svg>

      Continue with Google

    </button>


    <div class="divider">
      OR
    </div>


    <!-- EMAIL -->

    <form id="loginForm">


      <div class="form-group">

        <label>
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required>

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required>

      </div>


      <button
        type="submit"
        class="btn btn-primary form-submit">

        Login Securely

      </button>


    </form>


    <div
      class="message"
      id="message">
    </div>


    <div class="form-bottom">

      Don't have an account?

      <a href="register.html">
        Create Account
      </a>

    </div>


    <div
      class="form-bottom">

      <a href="index.html">
        ← Back to Website
      </a>

    </div>


  </div>

</div>


<script type="module">

import {
  signInWithPopup,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  auth,
  googleProvider
} from "./firebase-config.js";


const message =
  document.getElementById("message");


function showMessage(text, success = false) {

  message.style.display = "block";

  message.textContent = text;

  if (success) {

    message.style.background = "#dcfce7";
    message.style.color = "#166534";

  } else {

    message.style.background = "#fee2e2";
    message.style.color = "#b91c1c";

  }

}


// GOOGLE LOGIN

document
  .getElementById("googleLogin")
  .addEventListener("click", async () => {

    try {

      await signInWithPopup(
        auth,
        googleProvider
      );

      showMessage(
        "Login successful. Redirecting...",
        true
      );

      setTimeout(() => {

        window.location.href =
          "account.html";

      }, 700);

    } catch (error) {

      console.error(error);

      showMessage(
        "Google login failed. Please try again."
      );

    }

  });


// EMAIL LOGIN

document
  .getElementById("loginForm")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      showMessage(
        "Login successful. Redirecting...",
        true
      );

      setTimeout(() => {

        window.location.href =
          "account.html";

      }, 700);

    } catch (error) {

      console.error(error);

      showMessage(
        "Email or password is incorrect."
      );

    }

  });

</script>

</body>
</html>
