<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Login • Water Price Top Up BD
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>

<body class="auth-page">

<div class="auth-shell">

  <a
    class="auth-brand"
    href="index.html"
  >

    <span class="brand-mark">
      W
    </span>

    <b>
      Water Price<br>
      Top Up BD
    </b>

  </a>


  <section class="auth-card">

    <div class="auth-icon">
      W
    </div>

    <p class="eyebrow">
      WELCOME BACK
    </p>

    <h1>
      Login to your account
    </h1>

    <p class="muted">
      Securely continue to your
      top-up dashboard.
    </p>


    <button
      id="googleLogin"
      class="social-btn"
    >
      G&nbsp;&nbsp;
      Continue with Google
    </button>


    <div class="divider">
      <span>OR</span>
    </div>


    <form id="loginForm">

      <label>
        Email address

        <input
          id="email"
          type="email"
          required
          placeholder="you@example.com"
        >

      </label>


      <label>
        Password

        <input
          id="password"
          type="password"
          required
          placeholder="Your password"
        >

      </label>


      <button
        class="btn primary full"
        type="submit"
      >
        Login
      </button>

    </form>


    <p class="auth-footer">

      Don't have an account?

      <a href="register.html">
        Create account
      </a>

    </p>


    <a
      class="back"
      href="index.html"
    >
      ← Back to website
    </a>


    <p
      id="authMessage"
      class="message"
    ></p>

  </section>

</div>


<script
  type="module"
  src="app.js"
></script>

</body>
</html>
