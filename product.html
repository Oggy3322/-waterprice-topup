<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Top Up Products
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>

<header class="topbar">

  <a
    class="brand"
    href="index.html"
  >

    <span class="brand-mark">
      W
    </span>

    <span>
      WATER PRICE<br>
      <b>TOP UP BD</b>
    </span>

  </a>


  <div class="wallet-pill">

    ▣

    <span data-wallet>
      ৳0
    </span>

  </div>


  <button
    class="avatar"
    data-account
  >
    U
  </button>

</header>


<main class="page">


  <div class="page-title">

    <p class="eyebrow">
      FREE FIRE
    </p>

    <h1>
      Choose a Top Up
    </h1>

    <p class="muted">
      Select a package, enter your
      game UID and place your order.
    </p>

  </div>


  <div class="category-tabs">

    <button
      data-filter="all"
      class="selected"
    >
      All
    </button>

    <button
      data-filter="diamond"
    >
      Diamond
    </button>

    <button
      data-filter="weekly"
    >
      Weekly
    </button>

    <button
      data-filter="monthly"
    >
      Monthly
    </button>

    <button
      data-filter="like"
    >
      Likes
    </button>

  </div>


  <div
    id="products"
    class="products-grid"
  ></div>


  <section
    id="checkout"
    class="checkout panel hidden"
  >

    <p class="eyebrow">
      CHECKOUT
    </p>

    <h2 id="selectedProductName">
      Selected package
    </h2>

    <p>
      Price:

      <b id="selectedProductPrice">
        ৳0
      </b>

    </p>


    <form id="orderForm">

      <input
        type="hidden"
        id="selectedProductId"
      >


      <label>

        Game UID

        <input
          name="uid"
          id="gameUid"
          inputmode="numeric"
          required
          placeholder="Enter your Free Fire UID"
        >

      </label>


      <button
        class="btn primary full"
        type="submit"
      >
        Place Order
      </button>

    </form>

  </section>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    ⌂
    <span>Home</span>
  </a>

  <a href="orders.html">
    ▣
    <span>My Orders</span>
  </a>

  <a
    class="add active"
    href="product.html"
  >
    ＋
  </a>

  <a href="account.html">
    ☻
    <span>My Account</span>
  </a>

</nav>


<script
  type="module"
  src="app.js"
></script>

</body>
</html>
