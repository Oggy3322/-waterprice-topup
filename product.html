<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Place Order - Water Price Top Up BD</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="header">

  <div class="container navbar">

    <a href="index.html" class="brand">

      <div class="brand-logo">
        W
      </div>

      <div class="brand-name">
        Water Price Top Up BD
      </div>

    </a>


    <nav class="nav-links">

      <a
        href="index.html"
        class="nav-link">
        Home
      </a>

      <a
        href="orders.html"
        class="nav-link">
        My Orders
      </a>

      <a
        href="account.html"
        class="btn btn-primary">
        Account
      </a>

    </nav>

  </div>

</header>


<main class="product-page">

  <div class="container">


    <div class="product-detail">

      <div class="product-icon">
        W
      </div>


      <h1 id="productName">
        Top Up Package
      </h1>


      <p>
        Complete the information below to place your order.
      </p>


      <div class="order-box">


        <label>
          Package
        </label>

        <input
          id="packageName"
          readonly>


        <label>
          Price
        </label>

        <input
          id="packagePrice"
          readonly>


        <label>
          Player / Account ID
        </label>

        <input
          id="playerId"
          type="text"
          placeholder="Enter your ID"
          required>


        <button
          id="placeOrder"
          class="btn btn-primary"
          style="width:100%;">

          Confirm Order

        </button>


        <div
          id="message"
          class="message">
        </div>


      </div>

    </div>

  </div>

</main>


<script type="module">

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  auth
} from "./firebase-config.js";


const params =
  new URLSearchParams(
    window.location.search
  );


const product =
  params.get("product") ||
  "Top Up Package";


const price =
  params.get("price") ||
  "0";


document.getElementById("productName")
  .textContent = product;


document.getElementById("packageName")
  .value = product;


document.getElementById("packagePrice")
  .value = "৳" + price;


let currentUser = null;


onAuthStateChanged(auth, (user) => {

  if (!user) {

    window.location.href =
      "login.html";

    return;

  }

  currentUser = user;

});


document
  .getElementById("placeOrder")
  .addEventListener("click", () => {

    if (!currentUser) {

      window.location.href =
        "login.html";

      return;

    }


    const playerId =
      document.getElementById("playerId")
        .value.trim();


    const message =
      document.getElementById("message");


    if (!playerId) {

      message.style.display = "block";

      message.style.background = "#fee2e2";

      message.style.color = "#b91c1c";

      message.textContent =
        "Please enter your Player / Account ID.";

      return;

    }


    const key =
      "orders_" + currentUser.uid;


    const orders =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );


    const order = {

      id:
        "WPT-" +
        Date.now()
          .toString()
          .slice(-8),

      product: product,

      price: price,

      playerId: playerId,

      date:
        new Date()
          .toLocaleString()

    };


    orders.unshift(order);


    localStorage.setItem(
      key,
      JSON.stringify(orders)
    );


    message.style.display = "block";

    message.style.background = "#dcfce7";

    message.style.color = "#166534";

    message.textContent =
      "Order placed successfully!";


    setTimeout(() => {

      window.location.href =
        "orders.html";

    }, 900);

  });

</script>


</body>
</html>
