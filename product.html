<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Order - Water Price Top Up BD</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<script type="module">

import {
  auth
} from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getProduct,
  createOrder,
  renderHeader,
  renderBottomNav
} from "./app.js";


const params =
  new URLSearchParams(
    window.location.search
  );


const productId =
  params.get("id");


const product =
  getProduct(productId);


if (!product) {

  window.location.href =
    "index.html";

}


onAuthStateChanged(auth, user => {

  /*
    User must login before order.
  */

  if (!user) {

    window.location.href =
      `login.html?redirect=${encodeURIComponent(
        `product.html?id=${productId}`
      )}`;

    return;

  }


  renderHeader();


  const app =
    document.createElement("main");

  app.className = "page";


  app.innerHTML = `

    <section class="section">

      <a
        href="index.html#products"
        style="
          display:inline-block;
          margin-bottom:15px;
          color:#6127ed;
          font-weight:700;
        ">

        ← Back to products

      </a>


      <div class="product-detail">


        <div class="product-detail-art">

          <div class="big-diamond">
            ${product.icon}
          </div>

        </div>


        <div class="product-detail-content">

          <h1>
            ${product.name}
          </h1>


          <div class="detail-price">

            ${
              product.price === 0
                ? "FREE"
                : "৳" + product.price
            }

          </div>


          <p class="detail-description">

            ${product.description}

            <br><br>

            Please enter the required information
            below to place your order.

          </p>


          <div
            id="orderMessage"
            class="message">
          </div>


          <form
            id="orderForm"
            class="order-form">


            <input
              id="playerId"
              type="text"
              placeholder="Player ID / UID"
              required>


            <input
              id="phone"
              type="tel"
              placeholder="Mobile number"
              required>


            <button
              type="submit"
              class="full-btn">

              Place Order

            </button>


          </form>

        </div>

      </div>

    </section>

  `;


  document.body.appendChild(app);


  const form =
    document.getElementById(
      "orderForm"
    );

  const message =
    document.getElementById(
      "orderMessage"
    );


  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const playerId =
        document.getElementById(
          "playerId"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      if (!playerId || !phone) {

        message.textContent =
          "Please fill in all fields.";

        message.className =
          "message error";

        return;

      }


      const submitButton =
        form.querySelector("button");


      submitButton.disabled = true;

      submitButton.textContent =
        "Placing Order...";


      try {

        const orderId =
          await createOrder(
            product,
            playerId,
            phone
          );


        message.textContent =
          `Order placed successfully. Order ID: ${orderId}`;

        message.className =
          "message success";


        form.reset();


        setTimeout(() => {

          window.location.href =
            "orders.html";

        }, 1500);


      } catch (error) {

        console.error(error);

        message.textContent =
          "Could not place order. Please try again.";

        message.className =
          "message error";


        submitButton.disabled =
          false;

        submitButton.textContent =
          "Place Order";

      }

    }
  );


  renderBottomNav();

});

</script>

</body>
</html>
