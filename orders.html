<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>My Orders - Water Price Top Up BD</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<script type="module">

import {
  auth
} from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  renderHeader,
  renderBottomNav,
  loadUserOrders
} from "./app.js";


onAuthStateChanged(auth, async user => {

  if (!user) {

    window.location.href =
      "login.html?redirect=orders.html";

    return;

  }


  renderHeader();


  const app =
    document.createElement("main");

  app.className = "page";


  app.innerHTML = `

    <section class="section">

      <div class="section-head">

        <h2>My Orders</h2>

        <a href="index.html#products">
          New Order
        </a>

      </div>

      <div id="ordersList">
        <div class="empty-state">
          Loading orders...
        </div>
      </div>

    </section>

  `;


  document.body.appendChild(app);


  const list =
    document.getElementById("ordersList");


  try {

    const orders =
      await loadUserOrders();


    if (!orders.length) {

      list.innerHTML = `

        <div class="empty-state">

          <div style="font-size:45px">
            📦
          </div>

          <h3 style="margin:12px 0 7px">
            No orders yet
          </h3>

          <p>
            Your orders will appear here.
          </p>

        </div>

      `;

    } else {

      list.innerHTML =
        orders.map(order => {

          let date = "";

          if (order.createdAt) {

            try {

              date =
                order.createdAt
                  .toDate()
                  .toLocaleString();

            } catch {}

          }


          return `

            <div class="order-card">

              <div class="order-top">

                <div>

                  <h3>
                    ${order.productName}
                  </h3>

                </div>

                <span class="status">
                  ${order.status || "Pending"}
                </span>

              </div>


              <div class="order-info">

                Order ID:
                ${order.id}

                <br>

                Player/UID:
                ${order.playerId || "-"}

                <br>

                Phone:
                ${order.phone || "-"}

                <br>

                Amount:
                ৳${order.price || 0}

                <br>

                ${date}

              </div>

            </div>

          `;

        }).join("");

    }


  } catch (error) {

    console.error(error);

    list.innerHTML = `

      <div class="empty-state">

        Could not load orders.

      </div>

    `;

  }


  renderBottomNav("orders");

});

</script>

</body>
</html>
