<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    My Orders - Water Price Top Up BD
  </title>

  <link
    rel="stylesheet"
    href="style.css">

</head>


<body>


<script type="module">

import {
  auth
} from "./firebase-config.js";


import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  renderHeader,
  renderBottomNav,
  loadUserOrders
} from "./app.js";


/* =====================================================
   CHECK LOGIN
===================================================== */

onAuthStateChanged(
  auth,
  async user => {


    /*
      User is NOT logged in
    */

    if (!user) {

      window.location.href =
        "login.html?redirect=orders.html";

      return;

    }


    /*
      User IS logged in
    */

    renderHeader();


    const page =
      document.createElement(
        "main"
      );


    page.className =
      "page";


    page.innerHTML = `

      <section class="section">


        <div class="section-head">

          <h2>
            My Orders
          </h2>


          <a
            href="index.html#products">

            New Order

          </a>

        </div>


        <div
          id="ordersList">

          <div class="empty-state">

            <div
              style="
                font-size:35px;
                margin-bottom:10px;
              ">

              ⏳

            </div>

            Loading your orders...

          </div>

        </div>


      </section>

    `;


    document.body.appendChild(
      page
    );


    const ordersList =
      document.getElementById(
        "ordersList"
      );


    /* =================================================
       LOAD ONLY THIS USER'S ORDERS
    ================================================= */

    try {


      const orders =
        await loadUserOrders();


      /* -----------------------------------------------
         NO ORDERS
      ----------------------------------------------- */

      if (
        !orders ||
        orders.length === 0
      ) {


        ordersList.innerHTML = `

          <div
            class="empty-state">

            <div
              style="
                font-size:55px;
                margin-bottom:12px;
              ">

              📦

            </div>


            <h3
              style="
                margin-bottom:8px;
                color:#09243a;
              ">

              No orders yet

            </h3>


            <p>
              Your orders will appear here
              after you place an order.
            </p>


            <a
              href="index.html#products"
              class="hero-btn"
              style="
                margin-top:18px;
              ">

              Browse Products

            </a>

          </div>

        `;


      } else {


        /* ---------------------------------------------
           SHOW ORDERS
        --------------------------------------------- */

        ordersList.innerHTML =
          orders
            .map(
              order => {


                let dateText =
                  "Date unavailable";


                if (
                  order.createdAt &&
                  typeof order.createdAt.toDate
                    === "function"
                ) {

                  dateText =
                    order.createdAt
                      .toDate()
                      .toLocaleString(
                        "en-BD",
                        {
                          dateStyle:
                            "medium",
                          timeStyle:
                            "short"
                        }
                      );

                }


                const status =
                  order.status ||
                  "Pending";


                return `

                  <div
                    class="order-card">


                    <div
                      class="order-top">


                      <div>

                        <h3>
                          ${
                            escapeHtml(
                              order.productName ||
                              "Top Up"
                            )
                          }
                        </h3>

                      </div>


                      <span
                        class="status">

                        ${
                          escapeHtml(
                            status
                          )
                        }

                      </span>


                    </div>


                    <div
                      class="order-info">


                      <strong>
                        Order ID:
                      </strong>

                      ${
                        escapeHtml(
                          order.id
                        )
                      }

                      <br>


                      <strong>
                        Player / UID:
                      </strong>

                      ${
                        escapeHtml(
                          order.playerId ||
                          "-"
                        )
                      }

                      <br>


                      <strong>
                        Phone:
                      </strong>

                      ${
                        escapeHtml(
                          order.phone ||
                          "-"
                        )
                      }

                      <br>


                      <strong>
                        Amount:
                      </strong>

                      ৳${
                        Number(
                          order.price || 0
                        )
                      }

                      <br>


                      <strong>
                        Date:
                      </strong>

                      ${
                        escapeHtml(
                          dateText
                        )
                      }


                    </div>


                  </div>

                `;

              }
            )
            .join("");

      }


    } catch (error) {


      console.error(
        "Order loading error:",
        error
      );


      ordersList.innerHTML = `

        <div
          class="empty-state">


          <div
            style="
              font-size:45px;
              margin-bottom:10px;
            ">

            ⚠️

          </div>


          <h3
            style="
              margin-bottom:8px;
              color:#09243a;
            ">

            Could not load orders

          </h3>


          <p>

            Please refresh the page
            and try again.

          </p>


        </div>

      `;

    }


    /*
      Bottom navigation
    */

    renderBottomNav(
      "orders"
    );


  }
);


/* =====================================================
   ESCAPE HTML
   Prevents user data from becoming HTML.
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


</script>


</body>

</html>
