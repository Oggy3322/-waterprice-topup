<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  My Account
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>

<header class="topbar">

  <a
    class="brand"
    href="index.html"
  >

    <span class="brand-mark">
      W
    </span>

    <span>
      WATER PRICE<br>
      <b>TOP UP BD</b>
    </span>

  </a>


  <div class="wallet-pill">

    ▣

    <span data-wallet>
      ৳0
    </span>

  </div>


  <button
    class="avatar"
    data-account
  >
    U
  </button>

</header>


<main class="page account-page">


  <section class="profile-card">

    <div
      class="profile-avatar"
      data-user-initial
    >
      U
    </div>


    <div>

      <h1 data-user-name>
        User
      </h1>

      <p data-user-email>
        email
      </p>

      <span class="verified">
        ● Verified Account
      </span>

    </div>

  </section>


  <section class="balance-card">

    <div>

      <small>
        WALLET BALANCE
      </small>

      <strong data-wallet>
        ৳0
      </strong>

    </div>


    <a
      class="btn light"
      href="product.html"
    >
      Add Money
    </a>

  </section>


  <section class="rank-card">

    <div class="rank-head">

      <div>

        <p class="eyebrow">
          CURRENT RANK
        </p>

        <h2 data-rank-name>
          Bronze
        </h2>

        <p>
          Total top-up:
          <b data-total-topup>
            ৳0
          </b>
        </p>

      </div>


      <img
        data-rank-logo
        src="assets/ranks/bronze.svg"
        alt="Rank"
      >

    </div>


    <div
      class="rank-list"
      data-rank-list
    ></div>

  </section>


  <section class="panel">

    <p class="eyebrow">
      ACCOUNT
    </p>

    <h2>
      User Information
    </h2>


    <div class="info-row">

      <span>
        👤
      </span>

      <div>

        <small>
          NAME
        </small>

        <b data-user-name>
          User
        </b>

      </div>

    </div>


    <div class="info-row">

      <span>
        ✉
      </span>

      <div>

        <small>
          EMAIL
        </small>

        <b data-user-email>
          -
        </b>

      </div>

    </div>


    <div class="info-row">

      <span>
        #
      </span>

      <div>

        <small>
          USER ID
        </small>

        <b
          class="uid"
          data-user-uid
        >
          -
        </b>

      </div>

    </div>

  </section>


  <button
    id="logoutBtn"
    class="btn danger full"
  >
    Logout
  </button>

</main>


<nav class="bottom-nav">

  <a href="index.html">
    ⌂
    <span>Home</span>
  </a>

  <a href="orders.html">
    ▣
    <span>My Orders</span>
  </a>

  <a
    class="add"
    href="product.html"
  >
    ＋
  </a>

  <a
    class="active"
    href="account.html"
  >
    ☻
    <span>My Account</span>
  </a>

</nav>


<script
  type="module"
  src="app.js"
></script>

</body>
</html>
