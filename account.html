<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>My Account - Water Price Top Up BD</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<script type="module">

import {
  auth
} from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  renderHeader,
  renderBottomNav,
  logout
} from "./app.js";


onAuthStateChanged(auth, user => {

  if (!user) {

    window.location.href =
      "login.html?redirect=account.html";

    return;

  }


  renderHeader();


  const app =
    document.createElement("main");

  app.className = "page";


  const photo =
    user.photoURL
      ? `<img src="${user.photoURL}" alt="Profile">`
      : (user.displayName ||
         user.email ||
         "U").charAt(0).toUpperCase();


  app.innerHTML = `

    <section class="section">

      <div class="section-head">
        <h2>My Account</h2>
      </div>


      <div class="profile-card">

        <div class="profile-avatar">
          ${photo}
        </div>

        <div class="profile-info">

          <h2>
            ${user.displayName || "User"}
          </h2>

          <p>
            ${user.email || ""}
          </p>

        </div>

      </div>


      <div class="account-grid">


        <a
          href="orders.html"
          class="account-menu">

          <div class="account-menu-icon">
            📦
          </div>

          <div>

            <h3>My Orders</h3>

            <p>
              View your previous orders
            </p>

          </div>

        </a>


        <a
          href="index.html#products"
          class="account-menu">

          <div class="account-menu-icon">
            💎
          </div>

          <div>

            <h3>Top Up</h3>

            <p>
              Browse available packages
            </p>

          </div>

        </a>


        <a
          href="index.html"
          class="account-menu">

          <div class="account-menu-icon">
            🏠
          </div>

          <div>

            <h3>Home</h3>

            <p>
              Return to homepage
            </p>

          </div>

        </a>


        <button
          id="logout"
          class="account-menu">

          <div class="account-menu-icon">
            ↪
          </div>

          <div>

            <h3>Logout</h3>

            <p>
              Sign out of your account
            </p>

          </div>

        </button>


      </div>

    </section>

  `;


  document.body.appendChild(app);


  document
    .getElementById("logout")
    .addEventListener(
      "click",
      logout
    );


  renderBottomNav("account");

});

</script>

</body>
</html>
