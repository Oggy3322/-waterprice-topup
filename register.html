<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Create Account • Water Price Top Up BD
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>

<body class="auth-page">

<div class="auth-shell">

  <a
    class="auth-brand"
    href="index.html"
  >

    <span class="brand-mark">
      W
    </span>

    <b>
      Water Price<br>
      Top Up BD
    </b>

  </a>


  <section class="auth-card">

    <div class="auth-icon">
      W
    </div>

    <p class="eyebrow">
      CREATE ACCOUNT
    </p>

    <h1>
      Join Water Price
    </h1>

    <p class="muted">
      Create your account to track
      orders and rank progress.
    </p>


    <form id="registerForm">

      <label>
        Name

        <input
          id="name"
          required
          placeholder="Your name"
        >

      </label>


      <label>
        Email address

        <input
          id="email"
          type="email"
          required
          placeholder="you@example.com"
        >

      </label>


      <label>
        Password

        <input
          id="password"
          type="password"
          minlength="6"
          required
          placeholder="Minimum 6 characters"
        >

      </label>


      <button
        class="btn primary full"
        type="submit"
      >
        Create account
      </button>

    </form>


    <p class="auth-footer">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </p>


    <a
      class="back"
      href="index.html"
    >
      ← Back to website
    </a>


    <p
      id="authMessage"
      class="message"
    ></p>

  </section>

</div>


<script
  type="module"
  src="app.js"
></script>

</body>
</html>
