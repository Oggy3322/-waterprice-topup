<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Water Price Top Up BD</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<script type="module">

import {
  products,
  getProduct,
  requireLogin,
  renderHeader,
  renderBottomNav
} from "./app.js";

renderHeader();


const app = document.createElement("main");

app.className = "page";

app.innerHTML = `

  <section class="hero">

    <small>Premium Digital Top-Up</small>

    <h1>
      Water Price<br>
      Top Up BD
    </h1>

    <p>
      Fast, simple and secure digital top-up service.
      Choose your package and place your order easily.
    </p>

    <a href="#products" class="hero-btn">
      View Offers
    </a>

  </section>


  <section class="section" id="products">

    <div class="section-head">
      <h2>Weekly Offer</h2>
      <a href="#products">View All</a>
    </div>

    <div class="product-grid" id="weeklyProducts"></div>

  </section>


  <section class="section">

    <div class="section-head">
      <h2>Monthly & Premium</h2>
      <a href="#products">View All</a>
    </div>

    <div class="product-grid" id="premiumProducts"></div>

  </section>


  <section class="section">

    <div class="section-head">
      <h2>Diamond Packages</h2>
    </div>

    <div class="product-grid" id="diamondProducts"></div>

  </section>


  <section class="section">

    <div class="feature-box">

      <div class="section-head">
        <h2>Why choose us?</h2>
      </div>

      <div class="feature-grid">

        <div class="feature">
          <div class="feature-icon">⚡</div>
          <h3>Fast Delivery</h3>
          <p>
            Orders are processed quickly
            after confirmation.
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">🔐</div>
          <h3>Secure Account</h3>
          <p>
            Your account and order
            information stays protected.
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">💎</div>
          <h3>Premium Service</h3>
          <p>
            Quality packages with a
            clean premium experience.
          </p>
        </div>

      </div>

    </div>

  </section>

`;

document.body.appendChild(app);


/* Product card */

function productCard(product) {

  return `

    <article class="product-card">

      <div class="product-art">

        <div class="diamond-icon">
          ${product.icon}
        </div>

      </div>

      <div class="product-content">

        <h3>${product.name}</h3>

        <p class="product-description">
          ${product.description}
        </p>

        <div class="product-bottom">

          <span class="price">
            ${product.price === 0
              ? "FREE"
              : "৳" + product.price}
          </span>

          <button
            class="order-btn"
            data-product="${product.id}">
            Order
          </button>

        </div>

      </div>

    </article>
  `;
}


/* Weekly */

document.querySelector("#weeklyProducts").innerHTML =
  products
    .filter(p => p.id === "weekly")
    .map(productCard)
    .join("");


/* Premium */

document.querySelector("#premiumProducts").innerHTML =
  products
    .filter(p =>
      ["monthly", "premium"].includes(p.id)
    )
    .map(productCard)
    .join("");


/* Diamonds */

document.querySelector("#diamondProducts").innerHTML =
  products
    .filter(p =>
      p.id.includes("diamond")
    )
    .map(productCard)
    .join("");


/* Order buttons */

document.querySelectorAll(
  "[data-product]"
).forEach(button => {

  button.addEventListener("click", () => {

    const id = button.dataset.product;

    if (!requireLogin(
      `product.html?id=${encodeURIComponent(id)}`
    )) {
      return;
    }

    window.location.href =
      `product.html?id=${encodeURIComponent(id)}`;

  });

});


renderBottomNav("home");

</script>

</body>
</html>
