<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c2cff" />

  <title>TopUp Buzz BD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f6f7fb;
      color: #171717;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 1px solid #eeeeee;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      height: 70px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 22px;
      font-weight: 800;
      color: #6c2cff;
      white-space: nowrap;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7b35ff, #4e14d9);
      display: grid;
      place-items: center;
      color: white;
      font-size: 20px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }

    nav a:hover {
      color: #6c2cff;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .login-btn,
    .account-btn {
      background: #6c2cff;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
    }

    .mobile-menu {
      display: none;
      font-size: 25px;
      background: transparent;
    }

    /* ================= HERO ================= */

    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .hero-box {
      min-height: 300px;
      border-radius: 25px;
      padding: 45px;
      color: white;
      background:
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.25), transparent 30%),
        linear-gradient(120deg, #5d21e8, #8d43ff);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .hero-text {
      max-width: 600px;
    }

    .hero-text small {
      background: rgba(255,255,255,.16);
      padding: 8px 13px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 45px;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 16px;
      opacity: .9;
      margin-bottom: 25px;
    }

    .hero-btn {
      background: white;
      color: #6424e9;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 800;
    }

    .hero-shape {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      display: grid;
      place-items: center;
      font-size: 90px;
    }

    /* ================= MAIN ================= */

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 18px 50px;
    }

    .section {
      margin-top: 35px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 25px;
    }

    .section-title span {
      color: #6c2cff;
      font-size: 14px;
      font-weight: 700;
    }

    /* ================= CATEGORIES ================= */

    .categories {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .category {
      background: white;
      border-radius: 15px;
      padding: 20px 10px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,.04);
    }

    .category-icon {
      width: 55px;
      height: 55px;
      border-radius: 15px;
      margin: auto auto 10px;
      display: grid;
      place-items: center;
      background: #eee8ff;
      font-size: 25px;
    }

    .category strong {
      font-size: 14px;
    }

    /* ================= PRODUCTS ================= */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .product {
      background: white;
      border-radius: 17px;
      padding: 17px;
      box-shadow: 0 5px 18px rgba(0,0,0,.04);
      border: 1px solid #eeeeee;
    }

    .product-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .product-icon {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      background: #f0ebff;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .product small {
      color: #777;
    }

    .product-info {
      background: #f7f7fa;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .order-btn {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      background: #6c2cff;
      color: white;
      font-weight: 700;
    }

    .order-btn:hover {
      background: #5520ca;
    }

    /* ================= OFFER ================= */

    .offers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .offer {
      padding: 22px;
      border-radius: 18px;
      color: white;
      min-height: 150px;
    }

    .offer:nth-child(1) {
      background: linear-gradient(135deg, #ff4f81, #ff8757);
    }

    .offer:nth-child(2) {
      background: linear-gradient(135deg, #405de6, #7b42f6);
    }

    .offer:nth-child(3) {
      background: linear-gradient(135deg, #00a878, #20c997);
    }

    .offer h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .offer p {
      font-size: 13px;
      opacity: .9;
    }

    /* ================= FOOTER ================= */

    footer {
      background: #17131f;
      color: white;
      margin-top: 40px;
      padding: 40px 18px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 30px;
    }

    footer h3 {
      margin-bottom: 14px;
    }

    footer p,
    footer a {
      color: #bbb;
      font-size: 14px;
      line-height: 1.8;
    }

    .copyright {
      max-width: 1200px;
      margin: 30px auto 0;
      padding-top: 20px;
      border-top: 1px solid #302b38;
      color: #999;
      font-size: 13px;
    }

    /* ================= MODAL ================= */

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 15px;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 27px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 18px;
      background: #f1f1f1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
    }

    .modal h2 {
      margin-bottom: 7px;
    }

    .modal-subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      border: 1px solid #ddd;
      padding: 13px;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .input-group input:focus {
      border-color: #6c2cff;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #6c2cff;
      color: white;
      border-radius: 10px;
      font-weight: 800;
      margin-top: 5px;
    }

    .google-btn {
      width: 100%;
      padding: 12px;
      background: white;
      color: #222;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 12px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #aaa;
      font-size: 12px;
      margin: 17px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #ddd;
      flex: 1;
    }

    .switch-auth {
      text-align: center;
      margin-top: 17px;
      font-size: 13px;
      color: #777;
    }

    .switch-auth button {
      background: transparent;
      color: #6c2cff;
      font-weight: 800;
    }

    .error-message {
      display: none;
      background: #ffe8e8;
      color: #c62828;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .success-message {
      display: none;
      background: #e6f8ed;
      color: #16813d;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    /* ================= ACCOUNT ================= */

    .account-info {
      text-align: center;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: #eee8ff;
      display: grid;
      place-items: center;
      font-size: 30px;
      color: #6c2cff;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logout-btn {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #f04444;
      color: white;
      border-radius: 10px;
      font-weight: 700;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .categories {
        grid-template-columns: repeat(3, 1fr);
      }

      .footer-inner {
        grid-template-columns: 1fr 1fr;
      }

      nav {
        display: none;
      }

      .mobile-menu {
        display: block;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        height: 62px;
      }

      .logo {
        font-size: 18px;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
      }

      .hero-box {
        min-height: 340px;
        padding: 28px 22px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero-shape {
        display: none;
      }

      .products {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .product {
        padding: 12px;
      }

      .product h3 {
        font-size: 14px;
      }

      .product-icon {
        width: 45px;
        height: 45px;
      }

      .offers {
        grid-template-columns: 1fr;
      }

      .categories {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .category {
        padding: 13px 5px;
      }

      .category-icon {
        width: 45px;
        height: 45px;
      }

      .footer-inner {
        grid-template-columns: 1fr;
      }

      .header-buttons .login-btn {
        padding: 9px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>
    <div class="header-inner">

      <a href="#" class="logo">
        <div class="logo-icon">⚡</div>
        TopUp Buzz
      </a>

      <nav>
        <a href="#home">Home</a>
        <a href="#offers">Weekly Offers</a>
        <a href="#monthly">Monthly</a>
        <a href="#games">Games</a>
      </nav>

      <div class="header-buttons">
        <button class="login-btn" id="headerLoginBtn">
          Login
        </button>

        <button class="account-btn" id="headerAccountBtn" style="display:none;">
